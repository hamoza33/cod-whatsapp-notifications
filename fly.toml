# Fly.io config for the cod-whatsapp-notifications app.
# Deploy with: flyctl deploy --remote-only
# After provisioning Postgres + setting secrets, the release_command will
# run `prisma migrate deploy` on every release so schema changes apply
# automatically.

app = "cod-whatsapp-notifications"
primary_region = "cdg"

[build]

[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  WHATSAPP_API_VERSION = "v17.0"
  COD_NETWORK_API_BASE_URL = "https://api.cod.network/v2"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
