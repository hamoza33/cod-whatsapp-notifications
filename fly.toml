# Fly.io config for the cod-whatsapp-notifications app.
# Deploy with: flyctl deploy --remote-only
# After provisioning Postgres + setting secrets, the release_command will
# run `prisma migrate deploy` on every release so schema changes apply
# automatically.
#
# The tracking worker runs in-process inside the Next.js server via
# instrumentation.ts. No separate worker process is needed unless you
# want to scale them independently. To split later:
#   [processes]
#     web = "node server.js"
#     worker = "node tracking-worker.js"
# and set TRACKING_WORKER_DISABLED=true in [env].

app = "cod-whatsapp-notifications"
primary_region = "cdg"

[build]

[deploy]
  release_command = "prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  WHATSAPP_API_VERSION = "v17.0"
  COD_NETWORK_API_BASE_URL = "https://api.cod.network/v2"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
